schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  WPE WebKit port to UWP ARM32 (Lumia 950 XL, Win10M 15254). Base tag wpewebkit-2.54.0,
  branch wpe-uwp-arm32/main. Lessons borrowed from Project Apotheosis, no dependency on it.
  Tech: clang-cl (thumbv7-unknown-windows-msvc) for engine, MSVC for harness, CMake+Ninja,
  vcpkg (icu, cairo, curl...), Strawberry Perl + bison for codegen.
  Conventions: upstream edits guarded with #if defined(WK_WEBKITVIEW) + WebKitView: comment.
  ASCII paths only. Exceptions off (_HAS_EXCEPTIONS=0, /EHs-c-). Single engine thread.
  Software Cairo render first; no JIT/GPU until M3. Milestone tags (wkview-m0/m1/m2/m3)
  are cut only on real-device proof, owner tests on hardware, agent builds on this PC.

