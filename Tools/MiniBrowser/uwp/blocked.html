<!doctype html>
<!-- MiniBrowser default blocked-navigation template. Staged as blocked.html;
     an app can override it with LocalState/blocked.html or an explicit path.
     Tokens (replaced after HTML-escaping the values, except {{PROCEED}} which
     is page markup): {{TITLE}} {{INTRO}} {{URL}} {{REASON}} {{TECHNICAL}}.
     {{PROCEED}} is the consented-proceed block for certificate failures and
     empty for every other failure (proceed only helps TLS trust). -->
<html><head><meta charset='utf-8'><style>body{font:18px 'DejaVu Sans';background:white;color:black;margin:24px}h1{font-size:28px;color:#a80000}.url{word-break:break-all;color:#333}.reason{margin:18px 0}</style></head><body>
<h1>{{TITLE}}</h1>
<p>{{INTRO}}</p>
<p class='url'>{{URL}}</p>
<p class='reason'>{{REASON}}</p>
<details><summary>Advanced</summary>
<p class='url'>{{URL}}</p>
<p>{{TECHNICAL}}</p>
{{PROCEED}}
</details>
<p>Check the address and try again, or use Back to return to the previous page.</p>
</body></html>
